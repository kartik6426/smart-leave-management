<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard - Smart Leave Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h1 {
            color: #205581;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-right: 10px;
        }

        .approve {
            background: #198754;
        }

        .reject {
            background: #dc3545;
        }

        #message {
            margin-top: 25px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>HR Dashboard</h1>
    <div class="subtitle">Smart Leave & Absence Management</div>

    <label for="requestId">Leave Request ID</label>

    <input
        type="text"
        id="requestId"
        placeholder="Enter Request ID"
    >

    <button class="approve" onclick="processRequest('hr_approve')">
        Approve Leave
    </button>

    <button class="reject" onclick="processRequest('hr_reject')">
        Reject Leave
    </button>

    <div id="message"></div>

</div>

<script>

const API_URL =
    "https://8s6b30rgtb.execute-api.ap-south-1.amazonaws.com/Prod/approval";

async function processRequest(action) {

    const requestId =
        document.getElementById("requestId").value.trim();

    const message =
        document.getElementById("message");

    if (!requestId) {
        message.className = "error";
        message.style.display = "block";
        message.textContent = "Please enter the Request ID.";
        return;
    }

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                request_id: requestId,
                action: action,
                manager_id: "HR001"
            })

        });

        const data = await response.json();

        message.style.display = "block";

        if (response.ok) {

            message.className = "success";

            message.textContent =
                data.message || "Request processed successfully.";

        } else {

            message.className = "error";

            message.textContent =
                data.message || "Unable to process request.";

        }

    } catch (error) {

        message.className = "error";
        message.style.display = "block";
        message.textContent = "Unable to connect to the approval API.";

    }
}

</script>

</body>
</html>
